[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-v1"
version = "0.1.0"
description = "Participant vs optimal analytics pipeline for BundleGame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16.0"]
# The CHI diagnosis module (analytics.diagnosis) needs a numeric stack; the core
# analytics package stays dependency-free. `dev` includes these so CI runs the
# diagnosis tests.
diagnosis = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
