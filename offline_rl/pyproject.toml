[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bundlegame-offline-rl"
version = "0.1.0"
description = "Masked discrete-action offline RL baselines for BundleGame frozen snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
bundlegame-offline-rl-train = "offline_rl.train:main"
bundlegame-offline-rl-validate = "offline_rl.schema:main"
bundlegame-offline-rl-export = "offline_rl.export_artifacts:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["offline_rl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
